# Optional: Render Blueprint. You can also create the service by hand (see README).
services:
  - type: web
    name: trade-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: UPSTASH_REDIS_REST_URL     # from your Upstash database (REST API section)
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_PASSCODE             # first admin passcode (6+ characters), so nobody else can claim /#admin
        sync: false
      - key: ADMIN_RESET_KEY            # used for "Forgot passcode?"; Render generates it, view it under Environment
        generateValue: true
